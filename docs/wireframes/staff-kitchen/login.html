<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Staff — Login</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/components.css">
</head>
<body>
<div class="stage">

  <div class="browser-frame">
    <div class="browser-toolbar">
      <div class="browser-dots"><span></span><span></span><span></span></div>
      <div class="browser-url">pos.lunchticket.local/login</div>
    </div>
    <div class="browser-content" style="display:flex; justify-content:center; align-items:center; min-height: 480px;">
      <div class="panel-narrow" style="text-align:center;">
        <div class="icon-badge" style="margin:0 auto var(--space-sm); width:56px; height:56px; font-size:26px;">🍱</div>
        <h1>Lunch Ticket POS</h1>
        <p class="caption" style="margin-bottom: var(--space-md);">Counter Staff sign in</p>

        <div class="card card-elevated" style="text-align:left;">
          <div class="field">
            <label for="username">Username</label>
            <input id="username" type="text" placeholder="staff.username">
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" type="password" placeholder="••••••••">
          </div>
          <a class="btn btn-primary" href="pos-home.html" style="display:block; text-align:center;">Log in</a>
        </div>
      </div>
    </div>
  </div>

  <div class="dev-note wide">
    <p><strong>Staff Login Screen</strong> — UC1 Login</p>
    <p>Reached from: App entry</p>
    <p>Leads to on success: <a href="pos-home.html">POS / Orders Home</a></p>
  </div>

</div>
</body>
</html>
